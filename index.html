<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyJob - Job Portal &amp; Applicant Tracking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#" onclick="home()">easyjob</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nv" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="#roles" onclick="home()">Jobs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#reviews" onclick="home()">Reviews</a>
          </li>
        </ul>
        <div id="navR" class="d-flex align-items-center gap-2 py-2 py-md-0"></div>
      </div>
    </div>
  </nav>

  <main>
    <div id="pub">
      <section class="text-center py-5">
        <div class="container">
          <h1 class="display-4 fw-bold">Find work that fits.</h1>
          <p class="lead text-body-secondary mb-4">
            Search open roles, apply with your CV, and track every application in one place.
          </p>
          <div class="card shadow-sm text-start mx-auto" style="max-width: 960px;">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-12 col-lg-4">
                  <input id="fk" class="form-control" placeholder="Search title, skill or company" oninput="jobs()">
                </div>
                <div class="col-6 col-lg-2">
                  <select id="fc" class="form-select" onchange="jobs()"></select>
                </div>
                <div class="col-6 col-lg-2">
                  <select id="fl" class="form-select" onchange="jobs()"></select>
                </div>
                <div class="col-6 col-lg-2">
                  <select id="ft" class="form-select" onchange="jobs()"></select>
                </div>
                <div class="col-6 col-lg-2">
                  <select id="fv" class="form-select" onchange="jobs()"></select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="roles" class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">
            Open roles <small id="cnt" class="text-body-secondary fs-6 ms-2"></small>
          </h3>
          <select id="fo" class="form-select w-auto" onchange="jobs()">
            <option value="new">Newest</option>
            <option value="deadline">Closing soon</option>
            <option value="title">Title A-Z</option>
          </select>
        </div>
        <div id="jl"></div>
      </section>

      <section id="reviews" class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <h3 class="mb-0">What people say</h3>
          <div class="d-flex align-items-center gap-2">
            <div id="rf" class="btn-group"></div>
            <button class="btn btn-light rounded-circle" data-bs-target="#rc" data-bs-slide="prev" aria-label="Previous">&lsaquo;</button>
            <button class="btn btn-light rounded-circle" data-bs-target="#rc" data-bs-slide="next" aria-label="Next">&rsaquo;</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div id="rc" class="carousel slide">
              <div class="carousel-indicators" id="ri"></div>
              <div class="carousel-inner" id="rs"></div>
            </div>
          </div>
        </div>
        <div id="rw" class="card mt-3"></div>
      </section>
    </div>

    <div id="dash" class="container py-4 d-none"></div>
  </main>

  <footer class="text-center text-body-secondary small py-4">
    &copy; EasyJob | BCA Final-Year Project, Karnatak University, Dharwad
  </footer>

  <div class="modal fade" id="mod" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" id="md">
      <div class="modal-content">
        <div class="modal-body p-4" id="mb"></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="tst" class="toast text-bg-dark" role="status">
      <div class="toast-body" id="tm"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
